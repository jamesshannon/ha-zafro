rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no custom actions.
  appropriate-polling:
    status: exempt
    comment: |
      Pure push. The coordinator has update_interval=None and is fed by the library's
      MQTT subscription.
  brands:
    status: todo
    comment: |
      brand/icon.png and brand/icon@2x.png are served locally, which is what the UI
      needs (HA 2026.3+ tries a custom integration's brand/ directory before the CDN,
      and the logo.png fallback chain resolves to icon.png). The rule itself is only
      satisfiable in core, which cannot serve local brand assets and requires a pull
      request against home-assistant/brands.

      No logo.png: the only lockup published on the vendor's site has the wordmark
      cropped against the canvas on three sides.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: No custom actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: done
    comment: |
      The coordinator subscribes in _async_setup, before the first refresh, and
      unsubscribes via config_entry.async_on_unload.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: Unique id is the lowercased account email.

  # Silver
  action-exceptions:
    status: done
    comment: |
      entity.async_call maps ZafroUnsupportedError to ServiceValidationError and every
      other ZafroError to HomeAssistantError, both with translated messages.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: No options flow.
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: Driven by the device's LWT topic and by the transport dropping.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: Handled inside pyzafro's reconnect loop, which logs once per transition.
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: 99% overall, no module below 96%.

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: >-
      The unit is on the local network and takes a DHCP lease, so it is findable in
      principle. But it is reachable only through the vendor cloud, so finding it
      grants no capability, and one config entry already covers every device on the
      account. That leaves a DHCP matcher whose only payoff is one prompt at first
      setup, keyed on an OUI belonging to the Wi-Fi module rather than to Zafro.
  discovery-update-info:
    status: exempt
    comment: See discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: No user-fixable condition is detectable yet.
  stale-devices:
    status: done
    comment: |
      Removed after a sustained absence from successful enumerations, never on one
      short listing and never on a failed call. async_remove_config_entry_device also
      lets the user delete a device the account has already stopped reporting.

  # Platinum
  async-dependency: done
  inject-websession:
    status: done
    comment: pyzafro borrows the session from async_get_clientsession and never closes it.
  strict-typing: done
